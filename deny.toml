[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Why: unmaintained-only advisory (no vulnerability) on chrono, which
    # br-drive and br-drive-example use directly and which service-engine
    # (br-service-engine), br-rust-common (br-core-events,
    # br-core-integration, br-util-observability), contract-jobs (svc-jobs),
    # croner, async-graphql and sqlx (their chrono features) pull in
    # (`cargo tree -i chrono -e normal`, checked 2026-11-18).
    # No upstream fix exists as of 2026-11-18: the advisory covers every
    # version, the locked 0.4.45 included. Waived by ID, never by crate, so
    # chrono's next advisory, a vulnerability included, still fails this
    # check.
    # Remove once chrono leaves this build graph, with the move to jiff
    # tracked across every Rust repo in the epic
    # https://github.com/BotResources/botresources.ai-claude-workspace/issues/341
    # Review by 2027-02-17.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, every version affected, no fixed release; move to jiff; review by 2027-02-17" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/BotResources/br-service-engine",
    "https://github.com/BotResources/br-rust-common",
    "https://github.com/BotResources/svc-jobs",
]
