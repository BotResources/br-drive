services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.12
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-s3", "-s3.port=9000", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      AWS_ACCESS_KEY_ID: e2eaccesskey
      AWS_SECRET_ACCESS_KEY: e2esecretkey
    ports:
      - "9000:9000"
